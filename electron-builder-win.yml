appId: os.molv.center
productName: MolvOS
copyright: Copyright © 2026 MolvOS Contributors
electronDist: .electron-win
directories:
  output: dist
  buildResources: build
files:
  - src/**/*
  - package.json
  - build/icon.png
  - "!**/*.map"
  - "!**/*.log"
asar: true
compression: normal
extraResources:
  - from: integrity.json
    to: integrity.json
  - from: docs
    to: docs
    filter:
      - "**/*"
  - from: cli
    to: cli
    filter:
      - "**/*"
  - from: src
    to: src
    filter:
      - "**/*"
win:
  icon: build/icon.ico
  target:
    - target: portable
      arch:
        - x64
  requestedExecutionLevel: asInvoker
portable:
  artifactName: MolvOS-${version}-Portable.${ext}
